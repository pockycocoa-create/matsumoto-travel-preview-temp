  <script type="module">// Bundled source: reservations.mjs
const types = new Map([
  ['hotel', 'ホテル'],
  ['transport', '交通・レンタカー'],
  ['restaurant', 'レストラン'],
]);

const statuses = new Map([
  ['active', '予約中'],
  ['cancelled', 'キャンセル済'],
  ['completed', '完了済'],
  ['unknown', '未登録・その他'],
]);

function tokyoDate(now = new Date()) {
  return new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(now);
}

function validDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const date = new Date(value + 'T00:00:00Z');
  return Number.isFinite(date.valueOf()) && date.toISOString().slice(0, 10) === value;
}

function formatDate(value) {
  if (!validDate(value)) return '未登録';
  const [year, month, day] = value.split('-');
  return `${year}年${Number(month)}月${Number(day)}日`;
}

function deadlineState(value, today) {
  if (!validDate(value)) return 'missing';
  if (value < today) return 'passed';
  return value === today ? 'today' : 'future';
}

function sourceMailUrl(value) {
  if (typeof value !== 'string' || !value.startsWith('https://')) return null;
  try {
    const url = new URL(value);
    if (url.origin === 'https://mail.example.invalid' && !url.username && !url.password) {
      return url.href;
    }
  } catch {
    return null;
  }
  return null;
}

const normalized = value => String(value ?? '').normalize('NFKC').toLowerCase().trim();

function selectReservations(rows, { type = '', status = '', query = '' }, today) {
  const terms = normalized(query).split(/\s+/).filter(Boolean);
  const groups = { upcoming: [], other: [], history: [] };
  const matches = rows.filter(row => {
    const knownStatus = statuses.has(row.status) ? row.status : 'unknown';
    if ((type && row.type !== type) || (status && knownStatus !== status)) return false;

    const fields = [
      row.provider, row.tripName, row.reference, row.notes, types.get(row.type),
      statuses.get(knownStatus),
    ].map(normalized);
    return terms.every(term => fields.some(field => field.includes(term)));
  });

  matches.sort((a, b) => {
    const first = validDate(a.startDate) ? a.startDate : '9999-99-99';
    const second = validDate(b.startDate) ? b.startDate : '9999-99-99';
    return first.localeCompare(second);
  });

  for (const row of matches) {
    if (row.status === 'cancelled' || row.status === 'completed') {
      groups.history.push(row);
    } else if (row.status === 'active' && validDate(row.startDate) && row.startDate >= today) {
      groups.upcoming.push(row);
    } else {
      groups.other.push(row);
    }
  }
  return groups;
}


// Bundled source: sheet-reservations.mjs


const reservationTabs = [
  ['ホテル予約', 'hotel'],
  ['交通・レンタカー', 'transport'],
  ['レストラン予約', 'restaurant'],
];

const reservationStatuses = new Map([
  ['予約中', 'active'],
  ['キャンセル済', 'cancelled'],
  ['完了済', 'completed'],
]);

const displayColumns = [
  '利用開始日', '利用終了日', '旅行・イベント名', '予約先', '予約番号',
  '人数', '金額', '支払状況', '予約状況', '無料キャンセル期限', '備考', '元メール',
];

function displayText(value) {
  return typeof value === 'string' && value.trim() ? value : '';
}

function sheetDate(value) {
  const text = value.trim();
  const slashDate = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(text);
  const iso = slashDate
    ? [slashDate[1], slashDate[2].padStart(2, '0'), slashDate[3].padStart(2, '0')].join('-')
    : text;
  return validDate(iso) ? iso : '';
}

function mapTab(values, type) {
  if (!Array.isArray(values) || !Array.isArray(values[0])) return [];

  const headers = values[0].map(cell => displayText(cell).trim());
  const columns = displayColumns.map(label => {
    const index = headers.indexOf(label);
    return index === headers.lastIndexOf(label) ? index : -1;
  });
  const records = [];

  for (const row of values.slice(1)) {
    if (!Array.isArray(row)) continue;
    const cells = columns.map(index => index < 0 ? '' : displayText(row[index]));
    if (cells.every(cell => !cell)) continue;

    const [start, end, tripName, provider, reference, guests, amount, payment, status, deadline, notes, mail] = cells;
    records.push({
      type,
      startDate: sheetDate(start),
      endDate: sheetDate(end),
      tripName,
      provider,
      reference,
      guests,
      amount,
      payment,
      status: reservationStatuses.get(status.trim()) ?? 'unknown',
      deadline: sheetDate(deadline),
      notes,
      sourceMail: sourceMailUrl(mail.trim()) ?? '',
    });
  }
  return records;
}

// Each input tab is a matrix of displayed cells with a header row.
// The tab name determines the G1 type. Other tabs and non-display columns are ignored.
function mapReservationTabs(tabs) {
  return reservationTabs.flatMap(([name, type]) => mapTab(tabs?.[name], type));
}

// Phase 15 preparation: project ONLY a pre-existing G1 *synthetic* row set.
// This is a display/data-minimization boundary, never authentication.
// Real Sheets/API/Google credentials are intentionally unsupported.
const TYPES = new Set(['hotel', 'transport', 'restaurant']);
const STATUSES = new Set(['active', 'cancelled', 'completed', 'unknown']);
const TEXT = [
  'tripName', 'provider', 'reference', 'guests', 'amount', 'payment', 'notes',
];
const DATE = ['startDate', 'endDate', 'deadline'];
const MAX_ROWS = 1000;
const MAX_TEXT_LENGTH = 2048;
const fail = () => { throw new Error('TRAVEL_DISPLAY_SOURCE_REJECTED'); };

function projectFixtureReservations(rows, { mode = 'SYNTHETIC_G1' } = {}) {
  if (mode !== 'SYNTHETIC_G1' || !Array.isArray(rows) || rows.length > MAX_ROWS) fail();

  return rows.map((record) => {
    if (record === null || typeof record !== 'object' || Array.isArray(record)) fail();
    if (!TYPES.has(record.type) || !STATUSES.has(record.status)) fail();

    // Explicit projection; arbitrary upstream columns do not cross into the UI.
    const result = { type: record.type, status: record.status };
    for (const key of TEXT) {
      const value = record[key] ?? '';
      if (typeof value !== 'string' || value.length > MAX_TEXT_LENGTH) fail();
      result[key] = value;
    }
    for (const key of DATE) {
      const value = record[key] ?? '';
      if (typeof value !== 'string' || (value !== '' && !validDate(value))) fail();
      result[key] = value;
    }
    const link = record.sourceMail ?? '';
    if (typeof link !== 'string' || link.length > MAX_TEXT_LENGTH) fail();
    // G1 permits only a reserved fictitious origin, never a live mailbox link.
    result.sourceMail = sourceMailUrl(link) ?? '';
    return Object.freeze(result);
  });
}


// Bundled source: app.mjs




const query = document.querySelector('#query');
const type = document.querySelector('#type');
const status = document.querySelector('#status');
const reset = document.querySelector('#reset');
const results = document.querySelector('#reservations');
const count = document.querySelector('#result-count');

const groupTitles = {
  upcoming: '今後の予約',
  other: '利用日・状態の確認が必要な予約',
  history: 'キャンセル済・完了済',
};
const deadlineLabels = { missing: '未登録', passed: '期限経過', today: '本日が期限' };

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function display(value) {
  return String(value ?? '').trim() ? String(value) : '未登録';
}

function addOptions(select, options) {
  for (const [value, label] of options) select.add(new Option(label, value));
}

function reservationCard(row, today) {
  const statusLabel = row.status === 'unknown' || !statuses.has(row.status)
    ? '未登録' : statuses.get(row.status);
  const state = deadlineState(row.deadline, today);
  const end = formatDate(row.endDate);
  const start = formatDate(row.startDate);
  const dates = end !== '未登録' && start !== end ? `${start} 〜 ${end}` : start;
  const card = element('details', undefined, 'card');
  const summary = element('summary');
  const overview = element('span', undefined, 'overview');
  const tags = element('span', undefined, 'tags');
  tags.append(
    element('span', display(types.get(row.type)), 'category'),
    element('span', statusLabel, row.status === 'active' ? 'status active' : 'status'),
  );
  overview.append(tags, element('span', display(row.provider), 'provider'), element('span', dates, 'dates'));
  if (row.tripName?.trim()) overview.append(element('span', row.tripName, 'trip'));

  const deadline = element('span', undefined, 'deadline');
  deadline.append(element('span', '無料キャンセル期限', 'deadline-label'));
  const due = element('span', formatDate(row.deadline), 'due-date');
  deadline.append(due);
  if (state === 'today' || state === 'passed') {
    deadline.append(element('span', deadlineLabels[state], 'deadline-warning'));
  }
  overview.append(deadline);
  summary.append(overview, element('span', '詳細', 'disclosure'));
  card.append(summary);

  const panel = element('div', undefined, 'card-panel');
  const fields = element('dl', undefined, 'detail-fields');
  const url = sourceMailUrl(row.sourceMail);
  const mail = url ? element('a', '元メールを開く（架空リンク）') : '未登録';
  if (url) {
    mail.href = url;
    mail.target = '_blank';
    mail.rel = 'noopener noreferrer';
  }
  const detail = [
    ['利用開始日', start], ['利用終了日', end],
    ['予約種別', display(types.get(row.type))], ['予約先', display(row.provider)],
    ['旅行・イベント名', display(row.tripName)], ['予約番号', display(row.reference)],
    ['人数', display(row.guests)], ['金額（原表記）', display(row.amount)],
    ['支払状況', display(row.payment)], ['予約状況', statusLabel],
    ['無料キャンセル期限', deadlineLabels[state] && state !== 'missing'
      ? `${formatDate(row.deadline)}（${deadlineLabels[state]}）` : formatDate(row.deadline)],
    ['備考', display(row.notes)], ['元メール', mail],
  ];
  for (const [label, value] of detail) {
    const field = element('div');
    const definition = element('dd');
    definition.append(value);
    field.append(element('dt', label), definition);
    fields.append(field);
  }
  panel.append(fields);
  if (state === 'passed') {
    panel.append(element('p', 'キャンセルの成立や料金の有無は予約先の案内をご確認ください。', 'deadline-note'));
  }
  card.append(panel);
  return card;
}

function render(rows, today) {
  const filters = { type: type.value, status: status.value, query: query.value };
  reset.hidden = !Object.values(filters).some(Boolean);
  const groups = selectReservations(rows, filters, today);
  const total = Object.values(groups).reduce((sum, list) => sum + list.length, 0);
  count.textContent = `表示中の予約は${total}件です。`;

  if (total === 0) {
    const message = rows.length ? '条件に一致する予約がありません。' : '予約はまだ登録されていません。';
    results.replaceChildren(element('p', message, 'empty'));
    return;
  }

  const sections = [];
  for (const [group, list] of Object.entries(groups)) {
    if (!list.length && group !== 'upcoming') continue;
    const section = element('section', undefined, 'reservation-section');
    const heading = element('h2', groupTitles[group]);
    heading.id = `section-${group}`;
    section.setAttribute('aria-labelledby', heading.id);
    const title = element('header', undefined, 'section-title');
    title.append(heading, element('span', `${list.length}件`, 'count'));
    section.append(title);
    for (const row of list) section.append(reservationCard(row, today));
    if (!list.length) section.append(element('p', '該当する今後の予約はありません。', 'empty'));
    sections.push(section);
  }
  results.replaceChildren(...sections);
}

// The source provides presentation records. The view only reads them.
const today = tokyoDate();
const rows = projectFixtureReservations(syntheticReservations({ today }));
const refresh = () => render(rows, today);

addOptions(type, types);
addOptions(status, statuses);
query.addEventListener('input', refresh);
type.addEventListener('change', refresh);
status.addEventListener('change', refresh);
reset.addEventListener('click', () => {
  query.value = type.value = status.value = '';
  query.focus();
  refresh();
});
refresh();
</script>
